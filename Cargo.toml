[workspace]
members = [
    "crates/engine-math",
    "crates/engine-identifiers",
    "crates/engine-object",
    "crates/engine-serialization",
    "crates/engine-scene",
    "crates/engine-assets",
    "crates/engine-input",
    "crates/engine-audio",
    "crates/engine-render-api",
    "crates/engine-render-wgpu",
    "crates/engine-animation",
    "crates/engine-physics-api",
    "crates/engine-physics-3d",
    "crates/engine-scripting-bridge",
    "crates/engine-runtime",
    "crates/engine-runtime/ffi",
    "apps/player",
    "apps/editor",
    "apps/editor/core",
    "apps/cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
engine-math = { path = "crates/engine-math" }
engine-identifiers = { path = "crates/engine-identifiers" }
engine-object = { path = "crates/engine-object" }
engine-serialization = { path = "crates/engine-serialization" }
engine-scene = { path = "crates/engine-scene" }
engine-assets = { path = "crates/engine-assets" }
engine-input = { path = "crates/engine-input" }
engine-audio = { path = "crates/engine-audio" }
engine-render-api = { path = "crates/engine-render-api" }
engine-render-wgpu = { path = "crates/engine-render-wgpu" }
engine-animation = { path = "crates/engine-animation" }
engine-physics-api = { path = "crates/engine-physics-api" }
engine-physics-3d = { path = "crates/engine-physics-3d" }
engine-scripting-bridge = { path = "crates/engine-scripting-bridge" }
engine-runtime = { path = "crates/engine-runtime" }
engine-runtime-ffi = { path = "crates/engine-runtime/ffi" }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }

bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=0.4.0"
sha2 = "=0.10.9"
wgpu = { version = "=27.0.1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
